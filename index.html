<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Work Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': '#1e40af', // blue-800
              'secondary': '#374151', // gray-700
              'accent': '#60a5fa', // blue-400
              'background': '#f9fafb', // gray-50
              'surface': '#ffffff',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-in-up': 'slideInUp 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideInUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react/": "https://esm.sh/react@18.3.1/"
  }
}
</script>
<style>
  /* This style preserves line breaks from textareas when rendered in HTML */
  .whitespace-pre-wrap {
    white-space: pre-wrap;
  }
  .custom-checkbox {
    appearance: none;
    -webkit-appearance: none;
    background-color: #f3f4f6; /* gray-100 */
    border: 1px solid #d1d5db; /* gray-300 */
    cursor: pointer;
    flex-shrink: 0;
  }
  .custom-checkbox:focus-visible {
    outline: 2px solid transparent;
    outline-offset: 2px;
    --tw-ring-color: #3b82f6; /* blue-500 */
    box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--tw-ring-color);
  }
  .custom-checkbox:checked {
    background-color: #3b82f6; /* blue-500 */
    border-color: #3b82f6;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='3.5' stroke='white'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M4.5 12.75l6 6 9-13.5'/%3e%3c/svg%3e");
    background-size: 80% 80%;
    background-position: center;
    background-repeat: no-repeat;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
